name: Build Prebuilt (ARM test)

# Test of the GitHub-hosted ARM runner option for prebuilt builds (replaces the self-hosted
# comma 3X tici runner -- see E:\appcb\agnos_container_runner_research.md).
#
#   push to ci-arm -> build job on ubuntu-24.04-arm (GitHub-hosted, free for public repos,
#                     4 vCPU / 16 GB RAM / 14 GB SSD) -> publish job (ubuntu-24.04) force-pushes
#                     the prebuilt branch in this repo
#
# ci-arm is the ITERATION branch: this file triggers on pushes to itself, but source_branch
# defaults to main, so every run still builds main and publishes main-pre. main itself is NOT
# an iteration target -- it is the road-test branch (the comma 4 tracks it; every push is a
# device update). Once green end-to-end, the final workflow lands on main as ONE fast-forward
# commit with the trigger switched back to push: [main].
#
# The build runs inside a container imported from the AGNOS system image pinned by the BUILT
# branch (openpilot/common/hardware/comma/agnos.json) -- i.e. the exact rootfs the device runs.
# glibc/Python/venv/clang parity is therefore by construction. No QEMU: the runner is arm64,
# so the container runs natively.
#
# Safety carried over from build-prebuilt.yaml (the proven 3X build):
#   - LFS: release-manifest copy means .gitattributes never enters the tree + hard pointer guard.
#   - RUNPATH: build in /data/openpilot (the device's RUNTIME path) via a bind mount.
#   - Same scons targets, same ffmpeg vendoring, same NEEDED-lib / LFS / size guards.
#
# Differences from the 3X build:
#   - no powersave toggling (hosted runner), ephemeral $RUNNER_TEMP mounts, fresh runner per job
#   - AGNOS image re-derived from the branch manifest each run, cached as the ~962 MB .xz while
#     the manifest hash is unchanged
#   - 14 GB disk: .xz deleted after decompression, sparse after conversion, raw after docker
#     import; workspace source + build tree deleted inside the build; docker rmi after the build.
#     df -h logged at each phase.
#   - the 6 GPU model pkls (DEV=QCOM scons targets that open /dev/kgsl-3d0 at build time --
#     impossible in the GPU-less container) are built HEADLESS inside the container instead:
#     CPU:LLVM capture (SConscript-mirrored commands + --retargetable) + in-process QCOM
#     precompile (libllvm-qcom, no GPU). The results are cached as a release asset on THIS
#     repo (release "pkl-cache", asset modelpkls_<key>.tar.gz), keyed by the model inputs
#     (tinygrad gitlink+tree, modeld SConscript, ONNX, transformations, nv12_info, tg_flags,
#     pipeline scripts). Miss -> pipeline runs in the build container -> asset published.

on:
  push:
    branches: [ci-arm]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to build (default: main)"
        required: false
        default: "main"

permissions:
  contents: write

env:
  SOURCE_BRANCH: ${{ github.event.inputs.source_branch || 'main' }}
  BUILD_DIR: "/data/openpilot"  # MUST equal the device's runtime path (RUNPATH)
  OUTPUT_DIR: ${{ github.workspace }}/output
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  CACHEDB: "/data/cache/tinygrad/cache.db"
  XDG_CACHE_HOME: "/data/cache"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-arm-${{ github.event.inputs.source_branch || 'main' }}
      cancel-in-progress: false
    outputs:
      source_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Runner state (disk + emergency-free candidates)
        run: |
          df -h /
          # If a run dies on disk, the documented emergency free (manual, from the UI) is:
          #   sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet
          ls -d /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet 2>/dev/null || true
          docker version --format 'docker {{.Server.Version}}' 2>/dev/null || echo "docker: not preinstalled"

      - name: "Prepare temp dirs (runner-owned: docker bind mounts + cache paths)"
        run: |
          mkdir -p "${RUNNER_TEMP}/opbuild" "${RUNNER_TEMP}/cache/tinygrad" "${RUNNER_TEMP}/venv" /tmp/agnos

      - name: Checkout source branch (submodules + LFS, shallow)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: ${{ env.SOURCE_BRANCH }}

      - name: LFS pull (guarantee real bytes, not pointers)
        run: git lfs pull

      - name: Record source commit
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Resolve AGNOS system image from branch manifest
        id: agnos
        run: |
          MANIFEST=openpilot/common/hardware/comma/agnos.json
          URL=$(jq -r '.[] | select(.name=="system") | .url' "$MANIFEST")
          HASH=$(jq -r '.[] | select(.name=="system") | .hash' "$MANIFEST")
          HASH_RAW=$(jq -r '.[] | select(.name=="system") | .hash_raw' "$MANIFEST")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "hash_raw=$HASH_RAW" >> "$GITHUB_OUTPUT"
          echo "AGNOS_HASH=$HASH_RAW" >> "$GITHUB_ENV"
          echo "AGNOS system image: $URL"

      - name: Cache AGNOS .xz (restore)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/agnos/system.img.xz
          key: agnos-xz-${{ steps.agnos.outputs.hash }}

      - name: Download + decompress AGNOS .xz
        id: agnosdl
        run: |
          set -e
          if [ -f /tmp/agnos/system.img.xz ]; then
            echo "restored .xz from cache"
            echo "dl=0" >> "$GITHUB_OUTPUT"
          else
            curl -fSL --retry 5 --retry-delay 5 -o /tmp/agnos/system.img.xz "${{ steps.agnos.outputs.url }}"
            echo "dl=1" >> "$GITHUB_OUTPUT"
          fi
          xz -dk -T0 /tmp/agnos/system.img.xz   # -k keeps the .xz (cached below)
          # hash = sha256 of the DECOMPRESSED (still-sparse) image (agnos.py StreamingDecompressor);
          # hash_raw = sha256 of the UNSPARSIFIED raw image. No manifest hash exists for the .xz.
          echo "${{ steps.agnos.outputs.hash }}  /tmp/agnos/system.img" | sha256sum -c -
          df -h /

      - name: Save AGNOS .xz cache (fresh download only)
        if: steps.agnosdl.outputs.dl == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/agnos/system.img.xz
          key: agnos-xz-${{ steps.agnos.outputs.hash }}

      - name: Free .xz (14 GB disk)
        run: rm -f /tmp/agnos/system.img.xz
      - name: Convert sparse -> raw (simg2img first; hash_raw check is the proof)
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v simg2img >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq android-sdk-libsparse-utils; }
          # NOTE: this AGNOS image is the LE sequential sparse variant (agnos.py unsparsify()).
          # If simg2img misparses the chunk layout, the hash_raw check below catches it and the
          # Python fallback (an exact mirror of agnos.py) takes over.
          if simg2img /tmp/agnos/system.img /tmp/agnos/system.raw.img && \
             echo "${{ steps.agnos.outputs.hash_raw }}  /tmp/agnos/system.raw.img" | sha256sum -c -; then
            echo "OK: simg2img output matches hash_raw"
          else
            echo "::warning::simg2img failed or mismatched -- using Python unsparsify (agnos.py algorithm)"
            rm -f /tmp/agnos/system.raw.img
            python3 "${RUNNER_TEMP}/agnos_unsparsify.py"
            echo "${{ steps.agnos.outputs.hash_raw }}  /tmp/agnos/system.raw.img" | sha256sum -c -
            echo "OK: Python fallback output matches hash_raw"
          fi
          rm -f /tmp/agnos/system.img   # sparse no longer needed
          df -h /

      - name: Import rootfs as docker image (loop-mount RO + tar pipe, no intermediate files)
        run: |
          set -e
          command -v docker >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq docker.io; }
          if ! sudo docker info >/dev/null 2>&1; then sudo systemctl enable --now docker; fi
          sudo mkdir -p /mnt/agnos
          sudo mount -o loop,ro /tmp/agnos/system.raw.img /mnt/agnos
          # sudo on tar matters: the rootfs has root-only files
          sudo tar -C /mnt/agnos --numeric-owner -cf - . | docker import - ap-agnos:local
          sudo umount /mnt/agnos
          rm -f /tmp/agnos/system.raw.img
          docker images
          df -h /

      - name: Smoke test AGNOS container (this IS the device userspace)
        run: |
          docker run --rm --platform linux/arm64 ap-agnos:local bash -lc '
            echo "AGNOS: $(cat /VERSION)"
            test -f /AGNOS && echo "/AGNOS present (SConstruct COMMA_HARDWARE path)"
            /usr/local/venv/bin/python --version
            clang --version | head -1
            uv --version
            rsync --version | head -1
            nproc
          '

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: Cache tinygrad
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cache
          key: tgrad-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ env.AGNOS_HASH }}-${{ github.sha }}
          restore-keys: |
            tgrad-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ env.AGNOS_HASH }}
            tgrad-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}

      - name: Compute venv cache key
        id: venvkey
        run: echo "lockhash=$(git hash-object uv.lock)" >> "$GITHUB_OUTPUT"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/venv
          key: venv-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ env.AGNOS_HASH }}-${{ steps.venvkey.outputs.lockhash }}
          restore-keys: |
            venv-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ env.AGNOS_HASH }}
      - name: Write helper scripts (Python unsparsify fallback + in-container build)
        run: |
          # Quoted heredocs: no expansion by the runner shell. Bodies sit at the block-scalar base
          # indent, so they land at column 0 in the scripts.
          cat > "${RUNNER_TEMP}/agnos_unsparsify.py" <<'AGNOSP'
          #!/usr/bin/env python3
          # AGNOS sparse -> raw. Mirror of openpilot/common/hardware/comma/agnos.py unsparsify() --
          # the device's own parser. Format (verified on the real image): 28-byte LE file header
          # (magic 0xed26ff3a, major, minor, fh_sz, ch_sz, blk_sz, total_blks, total_chunks, crc)
          # + 12-byte chunk headers <H2xI4x> (type, reserved, out_blocks, +4 pad), sequential
          # layout (no start offset). Types: 0xcac1 raw, 0xcac2 fill, 0xcac3 dontcare.
          import os
          import struct
          SRC, DST = "/tmp/agnos/system.img", "/tmp/agnos/system.raw.img"
          CHUNK = struct.Struct("<H2xI4x")
          with open(SRC, "rb") as f, open(DST, "wb") as out:
              magic, major, minor, fh_sz, ch_sz, blk, total_blks, nchunks, crc = struct.unpack("<IHHHHIIII", f.read(28))
              assert magic == 0xed26ff3a, f"bad magic {magic:#x}"
              assert (major, minor) == (1, 0), (major, minor)
              pos = 0
              for i in range(nchunks):
                  ct, ob = CHUNK.unpack(f.read(12))
                  if ct == 0xcac1:      # raw: payload follows in the file
                      data = f.read(ob * blk)
                      assert len(data) == ob * blk, f"chunk {i} truncated"
                      out.write(data)
                  elif ct == 0xcac2:    # fill: 4-byte pattern repeated across the block
                      pat = f.read(4) * (blk // 4)
                      left = ob
                      while left:
                          n = min(left, 1024)
                          out.write(pat * n)
                          left -= n
                  elif ct == 0xcac3:    # dontcare: yields nothing
                      pass
                  else:
                      raise SystemExit(f"chunk {i}: unhandled sparse chunk type {ct:#06x}")
                  pos += ob * blk
                  if i % 1000 == 0:
                      print(f"  chunk {i}/{nchunks} pos={pos} bytes", flush=True)
              if pos < total_blks * blk:
                  tail = total_blks * blk - pos
                  print(f"  dontcare shortfall {tail} bytes -> zero pad", flush=True)
                  out.write(b"\x00" * tail)
          print(f"done: {os.path.getsize(DST)} bytes", flush=True)
          AGNOSP
          cat > "${RUNNER_TEMP}/ap_build.sh" <<'APBUILD'
          #!/bin/bash
          set -euo pipefail

          # --- environment (mirrors the 3X workflow's "Set environment variables") ---
          export UV_PROJECT_ENVIRONMENT=/root/venv
          unset VIRTUAL_ENV
          mkdir -p /data/cache/tinygrad
          cd /workspace
          # Runner checks out as uid 1001, the container runs as root -> git's
          # dubious-ownership check rejects /workspace. release_files.py runs `git ls-files`.
          git config --global --add safe.directory /workspace
          echo "=== disk at container start ==="; df -h /data /workspace 2>/dev/null || df -h
          # --extra tools: SConstruct imports bzip2/ncurses unconditionally (see 3X workflow comment)
          uv sync --frozen --extra tools --python /usr/local/venv/bin/python
          export VIRTUAL_ENV="${UV_PROJECT_ENVIRONMENT}"
          export PATH="${VIRTUAL_ENV}/bin:${PATH}"

          # --- setup (mirrors "Setup build environment"; powersave dropped -- no device governor) ---
          BUILD_DIR=/data/openpilot
          find "${BUILD_DIR}" -mindepth 1 -delete 2>/dev/null || true

          # --- build (same targets/flags as the 3X workflow) ---
          export PYTHONPATH="${BUILD_DIR}"
          # Copy only release-manifest files (this is why .gitattributes never enters the tree).
          ./tools/release/release_files.py | tr '\n' '\0' | rsync -rRl --from0 --files-from=- . "${BUILD_DIR}/"

          # --- model pkls (release-asset cache; /pkls is a runner bind mount) ---
          # The 6 DEV=QCOM scons targets need /dev/kgsl-3d0 at build time. Gate them off
          # (the driving-warp loop, like the already-gated dm-warp loop) and stage the
          # headless-built pkls instead. BUILD_DIR copy only: the pkl cache key was
          # computed from the pristine checkout.
          sed -i "s/^for cam_w, cam_h in camera_configs:\$/for cam_w, cam_h in [] if os.getenv('SKIP_TINYGRAD_COMPILE') else camera_configs:/" \
            "${BUILD_DIR}/openpilot/selfdrive/modeld/SConscript"
          n=$(grep -c SKIP_TINYGRAD_COMPILE "${BUILD_DIR}/openpilot/selfdrive/modeld/SConscript" || true)
          [ "$n" = "3" ] || { echo "::error::modeld SConscript SKIP gate patch failed (count=$n, want 3)"; exit 1; }
          export SKIP_TINYGRAD_COMPILE=1
          if [ ! -f /pkls/manifest.json ]; then
            echo "::group::model pkl cache miss -> headless pipeline (key=${PKL_KEY})"
            python3 /headless_modelpkls.py "${PKL_KEY}" "${BUILD_DIR}" /pkls
            echo "::endgroup::"
          fi
          # Verify the manifest (key + sha256 + bytes) and stage into the build tree before scons.
          python3 - <<'PKLCHK'
          import hashlib, json, os, shutil
          m = json.load(open("/pkls/manifest.json"))
          key = os.environ["PKL_KEY"]
          assert m["key"] == key, f"manifest key {m['key']} != {key}"
          models = "/data/openpilot/openpilot/selfdrive/modeld/models"
          assert len(m["pkls"]) == 6, f"manifest lists {len(m['pkls'])} pkls, want 6"
          for name, info in sorted(m["pkls"].items()):
            data = open(os.path.join("/pkls", name), "rb").read()
            assert len(data) == info["bytes"], (name, len(data), info["bytes"])
            assert hashlib.sha256(data).hexdigest() == info["sha256"], name
            dst = os.path.join(models, name)
            shutil.copyfile(os.path.join("/pkls", name), dst)
            assert hashlib.sha256(open(dst, "rb").read()).hexdigest() == info["sha256"], ("staged copy", name)
            print(f"OK {name} {len(data)}B {info['sha256'][:16]}", flush=True)
          print("OK: 6 model pkls verified + staged into the build tree", flush=True)
          PKLCHK

          # Free the workspace source now: nothing after this reads it (verified: SConstruct and
          # every SConscript never invoke git; the ffmpeg libs come from the venv, not the tree).
          # Keep release/ (the scons cache_dir), output/ and prebuilt.tar.gz (build output) --
          # the runner disk is 14 GB.
          find /workspace -mindepth 1 -maxdepth 1 \
            ! -name release ! -name output ! -name prebuilt.tar.gz \
            -exec rm -rf {} +
          echo "=== disk after workspace source delete ==="; df -h /data /workspace 2>/dev/null || df -h

          cd "${BUILD_DIR}"
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py

          echo "Building sunnypilot's modeld_v2..."
          scons -j"$(nproc)" cache_dir=/workspace/release/ci/scons_cache --minimal openpilot/sunnypilot/modeld_v2
          echo "Building sunnypilot's locationd..."
          scons -j2 cache_dir=/workspace/release/ci/scons_cache --minimal openpilot/sunnypilot/selfdrive/locationd
          echo "Building openpilot's locationd..."
          scons -j"$(nproc)" cache_dir=/workspace/release/ci/scons_cache --minimal openpilot/selfdrive/locationd
          echo "Building rest of sunnypilot..."
          scons -j"$(nproc)" cache_dir=/workspace/release/ci/scons_cache --minimal
          # comma-deps-ffmpeg is a SHARED build: libav* RPATH points into THIS venv, a path no
          # tester's device has. Ship the three libs next to the binaries ($ORIGIN is on their RPATH).
          FFMPEG_LIB=$(python3 -c 'import ffmpeg; print(ffmpeg.LIB_DIR)')
          echo "Vendoring ffmpeg libs from ${FFMPEG_LIB}"
          cp -av "${FFMPEG_LIB}"/libavformat.so.* "${FFMPEG_LIB}"/libavcodec.so.* "${FFMPEG_LIB}"/libavutil.so.* \
                 "${BUILD_DIR}/openpilot/system/loggerd/"
          touch "${BUILD_DIR}/prebuilt"

          # --- prepare output (same exclusions as the 3X workflow) ---
          OUTPUT_DIR=/workspace/output
          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${OUTPUT_DIR}"
          rsync -am \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude='/workspace/release/ci/scons_cache' \
            --exclude='**/.git/' \
            --exclude='**/.gitattributes' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='openpilot/selfdrive/modeld/models/*driving*.onnx' \
            --exclude='openpilot/third_party/*x86*' \
            --exclude='openpilot/third_party/*Darwin*' \
            --delete-excluded \
            --chown=comma:comma \
            "${BUILD_DIR}/" "${OUTPUT_DIR}/"

          # Free the build tree (outputs already staged into OUTPUT_DIR) before the tar -- 14 GB disk.
          find "${BUILD_DIR}" -mindepth 1 -delete
          echo "=== disk after build-tree delete ==="; df -h /data /workspace 2>/dev/null || df -h

          # --- guard: every shared lib the binaries need must be resolvable (verbatim from 3X workflow) ---
          fail=0
          while read -r bin; do
            head -c 4 "$bin" | grep -q ELF || continue
            d=$(dirname "$bin")
            dirs=("$d")
            for p in $(readelf -d "$bin" 2>/dev/null | grep -oP 'Library (runpath|rpath): \[\K[^]]+' | tr ':' '\n'); do
              p=${p//\$ORIGIN/$d}
              case "$p" in /data/openpilot/*) p="${OUTPUT_DIR}${p#/data/openpilot}" ;; esac
              dirs+=("$p")
            done
            for need in $(readelf -d "$bin" 2>/dev/null | grep -oP 'Shared library: \[\K[^]]+'); do
              case "$need" in
                libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libstdc++.so.*|libgcc_s.so.*) continue ;;
              esac
              found=0
              for p in "${dirs[@]}"; do
                if [ -e "$p/$need" ]; then found=1; break; fi
              done
              if [ "$found" = "0" ] && { [ -e "/usr/lib/$need" ] || [ -e "/lib/$need" ]; }; then found=1; fi
              if [ "$found" = "0" ] && /sbin/ldconfig -p 2>/dev/null | grep -q " $need "; then found=1; fi
              if [ "$found" = "0" ]; then
                echo "::error::${bin} needs ${need}, which the device's loader will not find"
                readelf -d "$bin" 2>/dev/null | grep -E 'runpath|rpath' | sed 's/^/    /'
                fail=1
              fi
            done
          done < <(find "${OUTPUT_DIR}" -type f -perm -u+x)
          [ "$fail" = "0" ] || exit 1
          echo "OK: every NEEDED shared lib resolves on-device."

          # --- guard: fail on any LFS pointer stub / oversized file (verbatim from 3X workflow) ---
          if grep -rlIE "^version https://git-lfs\.github\.com/spec/v1" "${OUTPUT_DIR}" > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs found in build output (would brick the device):"
            cat /tmp/lfs_ptrs.txt
            exit 1
          fi
          if find "${OUTPUT_DIR}" -type f -size +99M | grep -q .; then
            echo "::error::file(s) >99MB in output (GitHub push would reject them):"
            find "${OUTPUT_DIR}" -type f -size +99M -exec ls -lh {} +
            exit 1
          fi
          echo "OK: no LFS pointer stubs or oversized files in output."

          # --- guard: the 6 model pkls in the output tree must still match the manifest ---
          python3 - <<'PKLCHK2'
          import hashlib, json, os
          m = json.load(open("/pkls/manifest.json"))
          models = "/workspace/output/openpilot/selfdrive/modeld/models"
          assert len(m["pkls"]) == 6, f"manifest lists {len(m['pkls'])} pkls, want 6"
          for name, info in sorted(m["pkls"].items()):
            data = open(os.path.join(models, name), "rb").read()
            assert len(data) == info["bytes"], (name, len(data), info["bytes"])
            assert hashlib.sha256(data).hexdigest() == info["sha256"], name
            print(f"OK output {name} {len(data)}B {info['sha256'][:16]}", flush=True)
          print("OK: 6 model pkls in the output tree match the manifest.", flush=True)
          PKLCHK2

          # --- tar ---
          tar czf /workspace/prebuilt.tar.gz -C "${OUTPUT_DIR}" .
          ls -la /workspace/prebuilt.tar.gz
          APBUILD
          cat > "${RUNNER_TEMP}/headless_modelpkls.py" <<'PKLSCRIPT'
          #!/usr/bin/env python3
          """headless_modelpkls.py -- Phase 3 of runner_plan_v2.md: build ALL 6 model pkls through
          the headless DEV=QCOM capture path, one child process per artifact.
          
          Driver (called by ap_build.sh in the AGNOS container on a pkl-cache miss):
            python3 /headless_modelpkls.py <cache-key> <build_dir> <out_dir>
            -> spawns one child per artifact, verifies each pkl, and writes <out_dir>/manifest.json
               {key, pkls: {name: {sha256, bytes}}} + the 6 pkls (the release-asset cache unit).
          
          Child (spawned by the driver; do not call directly):
            python3 /headless_modelpkls.py __capture__ <artifact> <build_dir> <out.pkl>
            artifact in: dmon, driving, dwarp1928, dwarp1344, dmwarp1928, dmwarp1344
          
          Capture machinery (validated in Phases 1+2 on the 3X; qcomcap_any_3x.py restructured):
            - stub QCOMDevice (headless; in-process QCOM codegen for launch dims)
            - TinyJit cnt=1 (skip eager; first call = capture, like the device-side load)
            - sched_batches + to_program record hooks; _hcq2.diskcache_get -> None (a warm disk
              cache makes hcq_compile skip sched_batches -> the twin has no pre-hcq records)
            - CPU-twin exec_hcq / exec_kernel (QCOM kernels run on the CPU renderer from their
              pre-optimized SINK; the KGSL ioctl is never issued)
          
          TWIN ARG RESOLUTION (the Phase-1 + Phase-2 fixes and their safety rules):
            - a batch entry's baked `_bufslots` (slot tuple, program-globals order) is non-empty
              and matches the twin's global count -> use it (== the real exec_hcq's resolution).
            - `_bufslots` empty (JIT model linears compile with cache=False -> no
              pm_replace_buffers -> args are PARAM inputs + raw BUFFER intermediates) -> resolve
              the Nth recorded HCQ call for the pkey (RECORD["calls_list"], recorded in BATCH
              order), so each entry hits its OWN buffers (driving model scratch) exactly like the
              real exec_kernel.
          
          Build commands come from build_artifacts(): the same openpilot imports the modeld
          SConscript makes, so they cannot drift from a device build. The dm warps use
          --border-fill 16: the OOB fill the reference device pkls (and the v1 pipeline) use.
          """
          import hashlib
          import json
          import os
          import pickle
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path
          
          def compute_params(build_dir):
            """The same imports openpilot/selfdrive/modeld/SConscript makes, so the capture
            commands cannot drift from what a device build would run."""
            from openpilot.common.transformations.camera import _ar_ox_fisheye, _os_fisheye
            from openpilot.common.transformations.model import MEDMODEL_INPUT_SIZE, DM_INPUT_SIZE
            from openpilot.system.camerad.cameras.nv12_info import get_nv12_info
            camera_configs = [(c.width, c.height) for c in (_ar_ox_fisheye, _os_fisheye)]
            return camera_configs, MEDMODEL_INPUT_SIZE, DM_INPUT_SIZE, get_nv12_info
          
          def build_artifacts(build_dir):
            """artifact label -> dict(pkl, kind, onnx, cmd); cmd carries a __OUT__ placeholder.
            SConscript-identical commands (+ --retargetable). The dm warps use --border-fill 16:
            the OOB fill the reference device pkls (and the v1 pipeline) use; with the fixed-seed
            M_inv the warp is degenerate (all px NN-sample src[0]), so the OOB fill is the only
            ref-vs-ci difference there (a fill of 1 mismatches ref by 15 on the OOB px)."""
            build_dir = Path(build_dir)
            if str(build_dir) not in sys.path:
              sys.path.insert(0, str(build_dir))  # for the openpilot.* imports below
            compiler = build_dir / "tinygrad_repo/examples/openpilot"
            models_dir = build_dir / "openpilot/selfdrive/modeld/models"
            camera_configs, (model_w, model_h), (dm_w, dm_h), get_nv12_info = compute_params(build_dir)
            arts = {}
            for onnx_name, label, pkl in (("dmonitoring_model.onnx", "dmon", "dmonitoring_model_tinygrad.pkl"),
                                          ("driving_supercombo.onnx", "driving", "driving_tinygrad.pkl")):
              arts[label] = dict(pkl=pkl, kind="onnx", onnx=models_dir / onnx_name,
                cmd=[str(compiler / "compile_onnx.py"), str(models_dir / onnx_name), "__OUT__",
                     "--out-of-band", "--benchmark-runs", "1", "--retargetable"])
            for cam_w, cam_h in camera_configs:
              stride, y_height, uv_height, _ = get_nv12_info(cam_w, cam_h)
              arts[f"dwarp{cam_w}"] = dict(pkl=f"driving_warp_{cam_w}x{cam_h}_tinygrad.pkl", kind="warp", onnx=None,
                cmd=[str(compiler / "compile_warp.py"),
                     "--frame", f"{cam_w},{cam_h},{stride},{y_height},{uv_height},{stride * (y_height + uv_height)}",
                     "--warp-to", f"{model_w}x{model_h}", "--layout", "yuv420", "--frames", "2",
                     "--retargetable", "--output", "__OUT__"])
            for cam_w, cam_h in camera_configs:
              stride, y_height, uv_height, frame_size = get_nv12_info(cam_w, cam_h)
              arts[f"dmwarp{cam_w}"] = dict(pkl=f"dm_warp_{cam_w}x{cam_h}_tinygrad.pkl", kind="warp", onnx=None,
                cmd=[str(compiler / "compile_warp.py"),
                     "--frame", f"{cam_w},{cam_h},{stride},{y_height},{uv_height},{frame_size}",
                     "--warp-to", f"{dm_w}x{dm_h}", "--layout", "luma", "--border-fill", "16",
                     "--transform-device", "NPY", "--retargetable", "--output", "__OUT__"])
            return arts
          
          def artifact_order(arts):
            return ["dmon", "driving"] + [k for k in arts if k.startswith("dwarp")] + [k for k in arts if k.startswith("dmwarp")]
          
          def child_prelude(build_dir, ART, spec, OUT):
            OUT.parent.mkdir(parents=True, exist_ok=True)
            TINYGRAD_REPO = build_dir / "tinygrad_repo"
          
            # ---- env BEFORE any tinygrad import: the SConscript comma_arm64 flags, verbatim ----
            os.environ.update({
              "DEV": "QCOM;CPU:LLVM", "IMAGE": "1", "FLOAT16": "1", "NOLOCALS": "1",
              "JIT_BATCH_SIZE": "0", "OPENPILOT_HACKS": "1", "PARALLEL": "0", "DEBUG": "1",
            })
            sys.path.insert(0, str(TINYGRAD_REPO))  # tinygrad + examples.openpilot.helpers
          
            # =============================================================================
            # 1. headless QCOM stub (mirrors QCOMDevice.__init__ at ops_qcom.py:315-337)
            # =============================================================================
            import tinygrad.runtime.ops_qcom as _oq
            from tinygrad.device import Compiled, Device
            from tinygrad.renderer.cstyle import QCOMCLRenderer
            from tinygrad.renderer.nir import IR3Renderer
          
            ARCH = "a630,IMAGE_PITCH_ALIGNMENT=64"  # gpu_id (6,3,0) + IMAGE=1, exactly as ops_qcom.py:335
          
            def _headless_qcom_init(self, device=""):
              Compiled.__init__(self, "QCOM", Device["CPU"].allocator, [QCOMCLRenderer, IR3Renderer], None, arch=ARCH)
              self.gpu_id = (6, 3, 0)
              self.var_vals = {"kgsl_fd": os.open(os.devnull, os.O_RDWR), "kgsl_ctx": 0}
            _oq.QCOMDevice.__init__ = _headless_qcom_init
            _oq.QCOMDevice.finalize = lambda self: None
          
            # =============================================================================
            # 2. skip TinyJit's eager pass (first call = capture, like the device-side load)
            # =============================================================================
            from tinygrad.engine import jit as _jit
            _orig_tinyjit_init = _jit._TinyJit.__init__
            def _tinyjit_skip_eager(self, fxn=None, captured=None, prune=False):
              _orig_tinyjit_init(self, fxn, captured, prune)
              if self.fxn is not None: self.cnt = 1
            _jit._TinyJit.__init__ = _tinyjit_skip_eager
          
            # =============================================================================
            # 3. record for the CPU-twin exec + the dims dump
            # =============================================================================
            import tinygrad.engine.realize as _rz
            import tinygrad.runtime.support.hcq2 as _hcq2
            from tinygrad.uop.ops import Ops
            from tinygrad.engine.realize import get_call_arg_uops
          
            RECORD = {"calls": {}, "calls_list": {}, "pkey2sink": {}, "dims": [], "callcount": Counter(), "pkey_gbufs": {}}
          
            _orig_sched_batches = _hcq2.sched_batches
            def _sched_batches_hook(l, profile):
              # Record the HCQ (batched) PROGRAM calls in BATCH ORDER. The batch that
              # _finalize_batch builds (becoming info.kernels) is l.src filtered to HCQ calls,
              # grouped by peer group -- l.src order for a single QCOM device. Recording in that
              # SAME order (NOT l.toposort()) makes the Nth batch entry with a given pkey match
              # the Nth recorded call for that pkey, so the twin's fallback resolves each entry's
              # OWN buffers instead of the first call's (required for repeated pkeys with distinct
              # buffers: driving model scratch, Phase 2 attempt 2).
              for c in l.src:
                if c.op is not Ops.CALL: continue
                if _hcq2.get_enqueue_devs(c) is None: continue  # not an HCQ (batched) call
                wc = c.without_after
                if wc.op is not Ops.CALL or wc.body.op is not Ops.PROGRAM: continue
                pkey = wc.body.key
                RECORD["calls"].setdefault(pkey, wc)
                RECORD["calls_list"].setdefault(pkey, []).append(wc)
                RECORD["callcount"][pkey] += 1
                # global buffer uops (program-globals order) for THIS call; diagnostics only.
                try:
                  gbufs = tuple(get_call_arg_uops(wc)[i] for i in wc.body.arg.globals)
                except Exception:
                  gbufs = ()
                RECORD["pkey_gbufs"].setdefault(pkey, []).append(gbufs)
              return _orig_sched_batches(l, profile)
            _hcq2.sched_batches = _sched_batches_hook
          
            # The DISK cache (~/.cache/tinygrad/cache.db) makes hcq_compile early-return WITHOUT
            # calling sched_batches (and lower_and_compile), leaving RECORD["calls"]/pkey2sink
            # empty for a cached linear -> the twin crashes with "no pre-hcq record" (diag 5).
            # Force a fresh schedule every run: the twin needs to see every kernel's SINK.
            _hcq2.diskcache_get = lambda *a, **k: None
          
            _orig_to_program = _rz.to_program
            def _to_program_hook(ast, renderer):
              prg = _orig_to_program(ast, renderer)
              if ast.op is Ops.SINK:
                RECORD["pkey2sink"].setdefault(prg.key, ast)
                if isinstance(renderer, (QCOMCLRenderer, IR3Renderer)):
                  RECORD["dims"].append({
                    "name": ast.arg.function_name, "global": [str(x) for x in prg.arg.global_size],
                    "local": [str(x) for x in prg.arg.local_size], "applied_opts": [str(o) for o in ast.arg.applied_opts],
                  })
              return prg
            _rz.to_program = _to_program_hook
          
            # =============================================================================
            # 4. CPU-twin exec (replaces exec_hcq; pm_exec looks it up as a realize module
            #    global, so the swap is effective without rebuilding the PatternMatcher)
            # =============================================================================
            from dataclasses import replace as _dreplace
            TWIN_CACHE = {}
            TWIN_FALLBACK = [0]    # batch entries resolved via the pre_call path (_bufslots empty)
            TWIN_SLOTSPATH = [0]   # batch entries resolved via their own baked slots
            WARNED_UNSAFE = set()  # pkeys warned about (repeated pkey, distinct buffer uops, fallback)
          
            import numpy as _np
            # weight/output buffer trajectory: did every persistent QCOM output buffer get (ever) written?
            # keyed by _buf (int); nnz computed LIVE at exec time (a Buffer object can't be retained --
            # holding refs would block allocator reuse and change the capture layout).
            WT_STATE = {}   # buf._buf -> [nbytes, dev, ever_nonzero]
            FIRST_DETAIL = {}  # path -> one-line diagnostic for the first entry taken via that path
            def _nnz(b):
              try:
                mv = b.as_memoryview()
                if not len(mv): return 0.0
                return float((_np.frombuffer(mv, _np.uint8) != 0).mean())
              except Exception:
                return -1.0
          
            def _track_out(abufs, twin):
              if not twin.arg.outs: return
              b = abufs[twin.arg.outs[0]]
              if str(b.device).split(":")[0] != "QCOM": return
              st = WT_STATE.setdefault(b._buf, [b.nbytes, str(b.device), False])
              if not st[2] and _nnz(b) > 0.01: st[2] = True
          
            def _twin_exec_hcq(ctx, call, ast):
              info = call.arg.aux
              ctx = _dreplace(ctx, var_vals={**ctx.var_vals, **{k: v for d in info.device for k, v in Device[d].var_vals.items()}})
              ets = []
              # per-exec batch-order index per pkey: info.kernels is in batch order (== l.src order for a
              # single QCOM dev), and RECORD["calls_list"][pkey] was recorded in the same order, so the Nth
              # batch entry with pkey X maps to calls_list[X][N-1] -> that entry's OWN buffers. This fixes
              # the repeated-pkey fallback (driving model scratch, Phase 2 attempt 2): the old code always
              # used the FIRST call per pkey, leaving later calls' scratch/state bufs stale -> run1 (fresh)
              # vs run2 (stale) non-determinism -> nan mismatch at compile_onnx.py:63.
              pkey_idx = Counter()
              for devices, name, estimates, stamps, pkey, _bufslots, _oi in info.kernels:
                if pkey is None: raise RuntimeError(f"non-kernel batch entry (name={name!r}); on QCOM all copies are kernels")
                HCQ_LOG[name] += 1
                pre_sink = RECORD["pkey2sink"].get(pkey)
                pre_call = RECORD["calls"].get(pkey)
                if pre_sink is None or pre_call is None:
                  raise RuntimeError(f"no pre-hcq record for pkey {pkey[:16].hex()!r} (name={name!r}) "
                    f"pre_sink={'yes' if pre_sink is not None else 'NO'} pre_call={'yes' if pre_call is not None else 'NO'} | "
                    f"records: pkey2sink={len(RECORD['pkey2sink'])} calls={len(RECORD['calls'])} dims={len(RECORD['dims'])}")
                twin = TWIN_CACHE.get(pkey)
                if twin is None:
                  twin = TWIN_CACHE[pkey] = _orig_to_program(pre_sink, Device["CPU"].renderer)
                use_slots = bool(_bufslots) and len(_bufslots) == len(twin.arg.globals)
                if use_slots:
                  # Slot path (one-time linear, cache=True): buffers from THIS entry's baked slots
                  # (program-globals order) == the real exec_hcq's resolution. Scalars/vars from pre_call
                  # (same pkey == same AST == same baked scalars).
                  if "slot" not in FIRST_DETAIL: FIRST_DETAIL["slot"] = (name[:24], len(_bufslots), len(twin.arg.globals), len(ctx.input_uops), pkey[:8].hex())
                  TWIN_SLOTSPATH[0] += 1
                  src_call = pre_call
                else:
                  # Fallback (JIT model linear, cache=False -> _bufslots empty): pick THIS entry's own
                  # call in batch order and resolve ITS buffers (PARAM inputs -> ctx.input_uops; raw
                  # BUFFER intermediates -> the call's own bufs), exactly like the real exec_kernel.
                  if "fallback" not in FIRST_DETAIL: FIRST_DETAIL["fallback"] = (name[:24], len(_bufslots), len(twin.arg.globals), len(ctx.input_uops), pkey[:8].hex())
                  idx = pkey_idx[pkey]
                  pkey_idx[pkey] += 1
                  calls_list = RECORD["calls_list"].get(pkey, [])
                  src_call = calls_list[idx] if idx < len(calls_list) else pre_call
                  if src_call is not pre_call and pkey not in WARNED_UNSAFE:
                    WARNED_UNSAFE.add(pkey)
                    ndistinct = len(set(RECORD["pkey_gbufs"].get(pkey, [])))
                    print(f"[info] repeated-pkey per-entry fallback: {name[:24]!r} pkey={pkey[:12].hex()} scheduled "
                      f"{len(calls_list)}x, {ndistinct} distinct buffer sets (resolving each entry's own call)", flush=True)
                  TWIN_FALLBACK[0] += 1
                resolved = _rz.resolve_params(src_call, ctx.input_uops)
                for bufs, device_vars in _rz.unwrap_multi(src_call, resolved):
                  var_vals = {**ctx.var_vals, **device_vars}
                  rt = _rz.get_runtime("CPU", twin, cache=ctx.cache)
                  gs, ls = twin.arg.launch_dims(var_vals)
                  try:
                    vals = tuple(var_vals[v.expr] if v.is_variable else _rz._resolve(src_call.src[1 + v.arg.slot], ctx.input_uops).val for v in twin.arg.vars)
                  except KeyError as e: raise RuntimeError(f"unbound Variable {e} in twin {name!r}") from None
                  if use_slots:
                    abufs = [ctx.input_uops[s].buffer.ensure_allocated() for s in _bufslots]
                  else:
                    abufs = [bufs[i].ensure_allocated() for i in twin.arg.globals]
                  _track_out(abufs, twin)
                  ets.append(rt(*[b._buf for b in abufs], global_size=gs, local_size=ls, vals=vals))
              if ctx.wait:
                for device in info.device: Device[device].synchronize(timeout=ctx.timeout)
              return ets
            _rz.exec_hcq = _twin_exec_hcq
          
            # =============================================================================
            # 4b. CPU-twin exec for raw (non-hcq) QCOM kernels (one-time prep kernels whose
            #     first buffer is not on an HCQ dev stay raw -> exec_kernel; under the stub
            #     that would be a no-op ioctl to /dev/null -> zero bufs dumped into the pkl).
            # =============================================================================
            from tinygrad.helpers import to_tuple
            EXECLOG = []          # (name, devs) for every raw exec_kernel QCOM call
            HCQ_LOG = Counter()   # per-kernel count for the batched (hcq) path
            _orig_exec_kernel = _rz.exec_kernel
            def _twin_exec_kernel(ctx, call, ast, devices=None):
              devs = devices if devices is not None else to_tuple(call.src[1].device)
              if not any(d.split(":")[0] == "QCOM" for d in devs):
                return _orig_exec_kernel(ctx, call, ast, devices)
              name = getattr(ast.arg, "name", "?")
              EXECLOG.append((name, tuple(str(d) for d in devs)))
              resolved = _rz.resolve_params(call, ctx.input_uops)
              pkey = ast.key
              pre_sink = RECORD["pkey2sink"].get(pkey)
              if pre_sink is None: raise RuntimeError(f"no twin sink recorded for exec_kernel program {pkey[:16].hex()!r} (name={name})")
              twin = TWIN_CACHE.get(pkey)
              if twin is None: twin = TWIN_CACHE[pkey] = _orig_to_program(pre_sink, Device["CPU"].renderer)
              ets = []
              for bufs, device_vars in _rz.unwrap_multi(call, resolved):
                var_vals = {**ctx.var_vals, **device_vars}
                rt = _rz.get_runtime("CPU", twin, cache=ctx.cache)
                gs, ls = twin.arg.launch_dims(var_vals)
                try:
                  vals = tuple(var_vals[v.expr] if v.is_variable else _rz._resolve(call.src[1 + v.arg.slot], ctx.input_uops).val for v in twin.arg.vars)
                except KeyError as e: raise RuntimeError(f"unbound Variable {e} in exec_kernel twin {name!r}") from None
                abufs = [bufs[i].ensure_allocated() for i in twin.arg.globals]
                _track_out(abufs, twin)
                ets.append(rt(*[b._buf for b in abufs], global_size=gs, local_size=ls, vals=vals))
              return ets
            _rz.exec_kernel = _twin_exec_kernel
          
            return ART, spec, OUT, RECORD, TWIN_CACHE, TWIN_FALLBACK, TWIN_SLOTSPATH, EXECLOG, HCQ_LOG, WT_STATE, FIRST_DETAIL, WARNED_UNSAFE
          
          # =============================================================================
          # 5. run + verify
          # =============================================================================
          def walk_uops(lin):
            seen, stack, out = set(), [lin], []
            while stack:
              u = stack.pop()
              if id(u) in seen: continue
              seen.add(id(u))
              out.append(u)
              stack.extend(u.src)
            return out
          
          def verify(OUT, spec, RECORD):
            import tinygrad.engine.realize as _rz
            from tinygrad.uop.ops import Ops
            a = None
            if spec["kind"] == "onnx":
              from examples.openpilot.helpers import load_pickle
              a = load_pickle(str(OUT), out_of_band=True)
              assert all(v[2] in ("QCOM", "NPY") for v in a["input_specs"].values()), a["input_specs"]
              assert all(v[2] in ("QCOM", "NPY") for v in a["output_specs"].values()), a["output_specs"]
            else:
              a = pickle.load(open(OUT, "rb"))
              assert all(v[2] in ("QCOM", "NPY") for v in a["input_specs"].values()), a["input_specs"]
            lin2 = a["run"].captured._linear
            progs = [u for u in walk_uops(lin2) if u.op is Ops.PROGRAM]
            nbinary = sum(1 for p in progs if p.src and p.src[-1].op is Ops.BINARY)
            badhost = [str(p.arg.target) for p in progs if not p.arg.target.device.startswith("CPU")]
            print(f"[verify] reloaded: programs={len(progs)} with_binary={nbinary} bad_host={len(badhost)}", flush=True)
            assert len(progs) > 0 and not badhost, "host programs must be CPU-targeted"
            assert nbinary == 0, f"retargetable pkl must ship host programs WITHOUT BINARY (modeld recompiles), got {nbinary}"
            from tinygrad.runtime.support.hcq2 import HCQInfo
            tl = lin2.src
            def tl_kind(c):
              wc = c.without_after
              if wc.op is not Ops.CALL: return "other"
              if isinstance(getattr(getattr(wc, "arg", None), "aux", None), HCQInfo): return "hcq"
              return "copy" if wc.src and wc.src[0].op is Ops.STORE else "other"
            kinds = Counter(tl_kind(c) for c in tl)
            print(f"[verify] top-level calls: {len(tl)}, kinds={dict(kinds)}", flush=True)
            assert set(kinds) <= {"hcq", "copy"} and kinds["hcq"] > 0, "top-level calls not exec-able on device"
            badii = [e[3] for e in a["run"].captured.expected_input_info if e[3] not in ("QCOM", "NPY")]
            assert not badii, badii
            # the device-side load path (modeld.py:174 + CapturedJit.linear), run headless:
            a["run"].captured._linear = _rz.lower_and_compile(a["run"].captured._linear)
            linked = a["run"].captured.linear
            print(f"[verify] modeld-load-path headless OK: lower_and_compile + hcq_link, {len(linked.src)} top calls", flush=True)
            print("[verify] ALL CHECKS PASSED", flush=True)
          
          def child(artifact, build_dir, out):
            import platform
            build_dir = Path(build_dir)
            assert (build_dir / "tinygrad_repo").is_dir(), f"no tinygrad_repo tree under {build_dir}"
            spec = build_artifacts(build_dir)[artifact]
            OUT = Path(out)
            ART, spec, OUT, RECORD, TWIN_CACHE, TWIN_FALLBACK, TWIN_SLOTSPATH, EXECLOG, HCQ_LOG, WT_STATE, FIRST_DETAIL, WARNED_UNSAFE = child_prelude(build_dir, artifact, spec, OUT)
            assert spec["onnx"] is None or Path(spec["onnx"]).is_file(), f"missing {spec['onnx']}"
            print(f"[env3x] artifact={ART} machine={platform.machine()} python={sys.version.split()[0]} tinygrad={build_dir / 'tinygrad_repo'}", flush=True)
            if spec["onnx"] is not None:
              # Informational only: the pkl cache key is computed from the ONNX blob itself, so for a
              # key-fresh build a mismatch is impossible (the ci-arm LFS-pinning assert was 3X-only).
              sha = hashlib.sha256(Path(spec["onnx"]).read_bytes()).hexdigest()
              print(f"[onnx] {spec['onnx']} ({Path(spec['onnx']).stat().st_size} B) sha256={sha}", flush=True)
            cmd = [c.replace("__OUT__", str(OUT)) for c in spec["cmd"]]
            print(f"[cmd] $ {' '.join(str(c) for c in cmd)}", flush=True)
            print(f"[env] DEV='QCOM;CPU:LLVM' IMAGE=1 FLOAT16=1 NOLOCALS=1 JIT_BATCH_SIZE=0 OPENPILOT_HACKS=1 PARALLEL=0 (SConscript flags + explicit CPU:LLVM for twins)", flush=True)
            sys.argv = list(cmd)
            import runpy
            runpy.run_path(cmd[0], run_name="__main__")
          
            print(f"[done] wrote {OUT} ({OUT.stat().st_size} B) sha256={hashlib.sha256(OUT.read_bytes()).hexdigest()}", flush=True)
            verify(OUT, spec, RECORD)
            (OUT.parent / f"{ART}_dims.json").write_text(json.dumps({"n_kernels": len(RECORD["dims"]), "kernels": RECORD["dims"]}, indent=2))
            print(f"[dims] v2 QCOM capture ({ART}): {len(RECORD['dims'])} kernels", flush=True)
            rep = Counter(RECORD["callcount"].values())
            print(f"[sched] pkeys scheduled: {len(RECORD['callcount'])} distinct; per-pkey schedule count dist: {dict(sorted(rep.items()))}", flush=True)
            multi = {k: v for k, v in RECORD["callcount"].items() if v > 1}
            if multi: print(f"[sched] pkeys scheduled >1x (need per-entry slots if _bufslots present): {len(multi)}", flush=True)
            print(f"[exec] RAW (non-hcq) QCOM kernels run via exec_kernel CPU-twin: {len(EXECLOG)}", flush=True)
            print(f"[exec] batched (hcq) kernel invocations: {sum(HCQ_LOG.values())} across {len(HCQ_LOG)} distinct", flush=True)
            print(f"[exec] twin per-entry-slot entries: {TWIN_SLOTSPATH[0]} | pre_call fallback entries: {TWIN_FALLBACK[0]} (each pkey scheduled 1x in its linear)", flush=True)
            for path, det in FIRST_DETAIL.items():
              print(f"[exec] first {path} entry: name={det[0]!r} len(_bufslots)={det[1]} len(globals)={det[2]} len(ctx.input_uops)={det[3]} pkey={det[4]}", flush=True)
            print(f"[exec] repeated-pkey fallback pkeys (model scratch, dmon-verified safe): {len(WARNED_UNSAFE)}", flush=True)
            # output-buffer write trajectory (INFORMATIONAL only; subject to allocator address-reuse
            # noise -- the real correctness gate is pkl_compare vs ref on GPU).
            ever = sum(1 for _, _, f in WT_STATE.values() if f)
            never = Counter(nb for nb, _, f in WT_STATE.values() if not f)
            print(f"[weights] (info) distinct QCOM output bufs touched: {len(WT_STATE)} (ever-nonzero={ever}, sampled-zero={len(WT_STATE) - ever})", flush=True)
            if never: print(f"[weights] (info) sampled-zero sizes: {dict(sorted(never.items()))}", flush=True)
            print(f"{ART.upper()} BUILD OK", flush=True)
          
          def driver(key, build_dir, out_dir):
            import platform
            build_dir = Path(build_dir)
            out_dir = Path(out_dir)
            assert (build_dir / "tinygrad_repo").is_dir(), f"no tinygrad_repo tree under {build_dir}"
            out_dir.mkdir(parents=True, exist_ok=True)
            arts = build_artifacts(build_dir)
            order = artifact_order(arts)
            print(f"[driver] key={key} build_dir={build_dir} out_dir={out_dir}", flush=True)
            print(f"[driver] machine={platform.machine()} python={sys.version.split()[0]} artifacts={order}", flush=True)
            for label in order:
              print(f"[cmd] $ {' '.join(str(c).replace('__OUT__', str(out_dir / arts[label]['pkl'])) for c in arts[label]['cmd'])}", flush=True)
            # clean stale outputs (idempotent re-runs)
            for label in order: (out_dir / arts[label]["pkl"]).unlink(missing_ok=True)
            (out_dir / "manifest.json").unlink(missing_ok=True)
            for i, label in enumerate(order, 1):
              pkl = out_dir / arts[label]["pkl"]
              print(f"===== [{i}/{len(order)}] {arts[label]['pkl']} =====", flush=True)
              # one child process per artifact: a bad artifact fails the run (check=True) without
              # taking down the others, and the full capture log stays in the build log in order
              subprocess.run([sys.executable, os.path.abspath(__file__), "__capture__", label, str(build_dir), str(pkl)], check=True)
            manifest = {"key": key, "pkls": {}}
            for label in order:
              data = (out_dir / arts[label]["pkl"]).read_bytes()
              assert len(data) > 0, arts[label]["pkl"]
              manifest["pkls"][arts[label]["pkl"]] = {"sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)}
              print(f"[manifest] {arts[label]['pkl']} {len(data)}B {manifest['pkls'][arts[label]['pkl']]['sha256'][:16]}", flush=True)
            with open(out_dir / "manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
            print(f"[manifest] wrote {out_dir / 'manifest.json'} (key={key})", flush=True)
            print("ALL 6 MODEL PKLS BUILT + VERIFIED", flush=True)
          
          if __name__ == "__main__":
            if len(sys.argv) == 5 and sys.argv[1] == "__capture__":
              child(sys.argv[2], sys.argv[3], sys.argv[4])
            elif len(sys.argv) == 4:
              driver(sys.argv[1], sys.argv[2], sys.argv[3])
            else:
              raise SystemExit(f"usage: {sys.argv[0]} <cache-key> <build_dir> <out_dir>  |  {sys.argv[0]} __capture__ <artifact> <build_dir> <out.pkl>")
          PKLSCRIPT
          chmod +x "${RUNNER_TEMP}/ap_build.sh"

      - name: Compute model-pkl cache key
        id: pklkey
        run: |
          # The key is everything that goes into the 6 pkls: the tinygrad gitlink + its full
          # tree, the modeld SConscript + both ONNX models + the transformation/nv12 params,
          # the QCOM compile flags, the AGNOS rootfs hash_raw (libllvm-qcom + libLLVM + the
          # venv's python come from it), the uv.lock (venv contents), and the pipeline
          # script itself. Any change -> new key -> cache miss -> rebuild. Over-invalidation
          # is cheap (a rebuild is ~15 min); a stale cache is not.
          TG_GITLINK=$(git rev-parse HEAD:tinygrad_repo)
          TG_TREE=$(git -C tinygrad_repo ls-tree -r HEAD)
          MODEL_BLOBS=$(git ls-tree -r HEAD -- \
            openpilot/selfdrive/modeld/SConscript \
            openpilot/selfdrive/modeld/models/dmonitoring_model.onnx \
            openpilot/selfdrive/modeld/models/driving_supercombo.onnx \
            openpilot/common/transformations \
            openpilot/system/camerad/cameras/nv12_info.py)
          TG_FLAGS='DEV=QCOM IMAGE=1 FLOAT16=1 NOLOCALS=1 JIT_BATCH_SIZE=0 OPENPILOT_HACKS=1'
          SCRIPT_SHA=$(sha256sum "${RUNNER_TEMP}/headless_modelpkls.py" | cut -d' ' -f1)
          KEY=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' "$TG_GITLINK" "$TG_TREE" "$MODEL_BLOBS" "$TG_FLAGS" "${{ steps.agnos.outputs.hash_raw }}" "$SCRIPT_SHA" "${{ steps.venvkey.outputs.lockhash }}" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "model pkl cache key=$KEY"
          echo "  tinygrad=$TG_GITLINK agnos=${{ steps.agnos.outputs.hash_raw }} script=${SCRIPT_SHA} lock=${{ steps.venvkey.outputs.lockhash }}"

      - name: Fetch model pkls from release-asset cache
        id: pklfetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET="modelpkls_${{ steps.pklkey.outputs.key }}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/pkls"
          # explicit --repo: the build script deletes the workspace .git, so gh cannot
          # infer the repository from cwd by the time later steps run (this step is before
          # the build, but keep it uniform and cwd-independent)
          if gh release view --repo "${{ github.repository }}" pkl-cache --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "cache HIT: $ASSET"
            gh release download --repo "${{ github.repository }}" pkl-cache --pattern "$ASSET" --dir "${RUNNER_TEMP}/pkls"
            tar xzf "${RUNNER_TEMP}/pkls/$ASSET" -C "${RUNNER_TEMP}/pkls"
            rm -f "${RUNNER_TEMP}/pkls/$ASSET"
            ls -la "${RUNNER_TEMP}/pkls"
            echo "hit=1" >> "$GITHUB_OUTPUT"
          else
            echo "cache MISS: $ASSET (the pipeline will run in the build container)"
            echo "hit=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build in AGNOS container
        run: |
          df -h /
          docker run --rm --platform linux/arm64 \
            -e CI=true \
            -e HOME=/root \
            -e UV_PROJECT_ENVIRONMENT=/root/venv \
            -e CACHEDB="${CACHEDB}" \
            -e XDG_CACHE_HOME="${XDG_CACHE_HOME}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${RUNNER_TEMP}/opbuild:/data/openpilot" \
            -v "${RUNNER_TEMP}/cache:/data/cache" \
            -v "${RUNNER_TEMP}/venv:/root/venv" \
            -v "${RUNNER_TEMP}/ap_build.sh:/build.sh:ro" \
            -v "${RUNNER_TEMP}/headless_modelpkls.py:/headless_modelpkls.py:ro" \
            -v "${RUNNER_TEMP}/pkls:/pkls" \
            -e PKL_KEY="${{ steps.pklkey.outputs.key }}" \
            ap-agnos:local bash /build.sh

      - name: Publish model pkls to release-asset cache (miss only)
        # success(): a custom if: alone overrides the implicit success gate, and this
        # step runs AFTER the build deleted the workspace .git -- on a failed build it
        # would publish a garbage asset that a later run would cache-hit.
        if: success() && steps.pklfetch.outputs.hit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET="modelpkls_${{ steps.pklkey.outputs.key }}.tar.gz"
          # The pipeline verified every pkl (reload + full check suite); the tar
          # (manifest.json + the 6 pkls) is the cache unit.
          tar czf "$ASSET" -C "${RUNNER_TEMP}/pkls" .
          ls -lh "$ASSET"
          # explicit --repo: ap_build.sh deleted the workspace .git (14 GB disk guard),
          # so gh cannot infer the repository from cwd here.
          gh release view --repo "${{ github.repository }}" pkl-cache >/dev/null 2>&1 || \
            gh release create --repo "${{ github.repository }}" pkl-cache --title "Model pkl cache" \
              --notes "Headless-built GPU model pkls for the ARM CI. One asset per model-input key; each tar.gz holds manifest.json (key + sha256 + bytes) + the 6 pkls."
          gh release upload --repo "${{ github.repository }}" pkl-cache "$ASSET" --clobber
          echo "published $ASSET"

      - name: Release docker image + build dir (14 GB disk)
        run: |
          sudo docker rmi -f ap-agnos:local || true
          sudo find "${RUNNER_TEMP}/opbuild" -mindepth 1 -delete 2>/dev/null || true
          df -h /

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz
  publish:
    needs: [ build ]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-arm-${{ github.event.inputs.source_branch || 'main' }}
      cancel-in-progress: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: Untar prebuilt
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish prebuilt (main -> main-pre)
        env:
          SRC: ${{ github.event.inputs.source_branch || 'main' }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # main -> main-pre (this test); keep the generic mappings for later porting.
          case "$SRC" in
            main)    DEV_BRANCH="main-pre" ;;
            *-src)   DEV_BRANCH="${SRC%-src}" ;;
            *)       DEV_BRANCH="${SRC}-prebuilt" ;;
          esac
          VERSION="$(date '+%Y.%m.%d')-${{ github.run_number }}"
          GIT_ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          echo "[-] publishing ${SRC} -> ${DEV_BRANCH} on ${REPO}"
          cd ${{ env.OUTPUT_DIR }}
          # LFS safety (belt + suspenders): no .gitattributes => `git add` cannot re-pointerize.
          find . -name .gitattributes -delete
          # Final pre-commit guard (anchored to the pointer's `version` first line; see 3X workflow).
          if grep -rlIE "^version https://git-lfs\.github\.com/spec/v1" . > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs present at publish time:"; cat /tmp/lfs_ptrs.txt; exit 1
          fi
          git init -q
          git remote add origin "$GIT_ORIGIN"
          git fetch -q origin "$DEV_BRANCH" \
            || (git checkout -b "$DEV_BRANCH" && git commit -q --allow-empty -m "initial prebuilt" && git push -u origin "$DEV_BRANCH")
          git add -f .
          DATETIME=$(date '+%Y-%m-%dT%H:%M:%S')
          git commit -q -a -m "prebuilt v${VERSION}
          source branch: ${SRC}
          date: ${DATETIME}
          source commit: ${SOURCE_SHA}
          "
          git branch -M "$DEV_BRANCH"
          git push -f origin "$DEV_BRANCH"
